# https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_dispatch
# https://docs.github.com/en/actions/how-tos/manage-workflow-runs/re-run-workflows-and-jobs
name: rulesets

on:
  workflow_dispatch:
    inputs:
      repo:
        description: The repo to apply its rule sets to, such as ThePearPoet143/ci-sandbox.
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: rulesets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run only on dev's latest commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SELF: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          . ./.github/ruleset/Ruleset.ps1
          $problem = Test-LatestDev $env:SHA (gh api "repos/$env:SELF/commits/dev" --jq .sha)
          if ($problem) { Write-Output $problem; exit 1 }
      - name: Apply the repo's rule sets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RULESET_TOKEN }}
          REPO: ${{ inputs.repo }}
        run: ./.github/ruleset/Set-Ruleset.ps1 -Repo $env:REPO
