name: pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

jobs:
  text:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/text-check
        with:
          issue-prefix: HQ

  size:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/size

  branch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/branch
        with:
          issue-prefix: HQ

  ruleset:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check the rule set is in force on dev and main
        shell: pwsh
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: ./.github/ruleset/Invoke-RulesetCheck.ps1
