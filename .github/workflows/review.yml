# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#issue_comment
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency
name: review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  checks: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: review-${{ github.event.pull_request.number || github.event.issue.number }}

jobs:
  post-status:
    name: post review status
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/review
      - uses: ./.github/actions/report
        continue-on-error: true
        with:
          pr: ${{ github.event.pull_request.number || github.event.issue.number }}
