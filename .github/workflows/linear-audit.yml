# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
# https://cli.github.com/manual/gh_issue_create
name: linear-audit

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/linear/**
      - .github/actions/text-check/**
      - .github/workflows/linear-audit.yml

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check every open HQ issue
        shell: pwsh
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: ./.github/linear/Invoke-LinearAudit.ps1
      - name: Open or update an issue when the daily run fails
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Daily check failed: Linear audit'
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "Failed again: $url"; else gh issue create --title "$TITLE" --body "The daily Linear audit failed: $url"; fi
