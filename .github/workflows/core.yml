# https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows
# https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context
name: core

on:
  workflow_call:
    inputs:
      issue-prefix:
        description: The repo's Linear issue key, such as HQ.
        required: true
        type: string
      size-ignored:
        description: More paths the size check leaves out, as globs separated by commas.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  text:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
      - uses: ./.ci/.github/actions/text-check
        with:
          issue-prefix: ${{ inputs.issue-prefix }}

  size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
      - uses: ./.ci/.github/actions/size
        with:
          extra-ignored: ${{ inputs.size-ignored }}

  branch:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
      - uses: ./.ci/.github/actions/branch
        with:
          issue-prefix: ${{ inputs.issue-prefix }}

  secrets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
      - uses: ./.ci/.github/actions/secrets

  review:
    name: post review status
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: review-${{ github.event.pull_request.number || github.event.issue.number }}
    permissions:
      contents: read
      checks: read
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
      - uses: ./.ci/.github/actions/review
      - uses: ./.ci/.github/actions/report
        continue-on-error: true
        with:
          pr: ${{ github.event.pull_request.number || github.event.issue.number }}
