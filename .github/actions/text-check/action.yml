name: Text check
description: Checks a PR's title and description against ci's rules.
inputs:
  issue-prefix:
    description: The repo's Linear issue key, such as HQ.
    required: true
runs:
  using: composite
  steps:
    - name: Check the title and description
      shell: pwsh
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        ISSUE_PREFIX: ${{ inputs.issue-prefix }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: '& "$env:GITHUB_ACTION_PATH/Invoke-TextCheck.ps1"'