# https://github.com/gitleaks/gitleaks#usage
# https://github.com/gitleaks/gitleaks/releases
name: Secret scan
description: Fails a PR whose own commits add a key, token or password, using gitleaks at one checked version.
runs:
  using: composite
  steps:
    - name: Scan the PR's commits for secrets
      shell: bash
      env:
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        cd "$RUNNER_TEMP"
        curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
        echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check
        tar -xzf "$tarball" gitleaks
        cd "$GITHUB_WORKSPACE"
        config="$RUNNER_TEMP/gitleaks.toml"
        if git cat-file -e "$BASE_SHA:.gitleaks.toml" 2>/dev/null; then
          git show "$BASE_SHA:.gitleaks.toml" > "$config"
        else
          printf '[extend]\nuseDefault = true\n' > "$config"
        fi
        mkdir -p "$RUNNER_TEMP/no-ignores"
        "$RUNNER_TEMP/gitleaks" git --no-banner --redact --ignore-gitleaks-allow --verbose \
          --config "$config" --gitleaks-ignore-path "$RUNNER_TEMP/no-ignores" \
          --max-decode-depth=2 --max-archive-depth=2 \
          --log-opts="--diff-merges=first-parent ${BASE_SHA}..${HEAD_SHA}" .
