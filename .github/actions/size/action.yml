# https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication
name: Size check
description: Labels a PR by its effective changed lines and fails size:XL and larger unless size-exempt.
inputs:
  extra-ignored:
    description: More paths to leave out of the count, as globs separated by commas.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Count and label
      shell: pwsh
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        EXTRA_IGNORED: ${{ inputs.extra-ignored }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        REPO: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
      run: '& "$env:GITHUB_ACTION_PATH/Invoke-Size.ps1"'